<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex justify-center items-start p-5">
    <div class="container bg-white rounded-xl shadow-lg w-full max-w-[500px] mt-6 overflow-hidden">
        <div class="header bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-6 text-center">
            <h1 class="text-3xl font-bold mb-2">My TODO App</h1>
            <p class="text-white/90 text-sm">Stay organized and get things done</p>
        </div>
        
        <div class="input-section p-6 bg-gray-50 border-b">
            <div class="flex gap-3">
                <input type="text" id="taskInput" placeholder="What needs to be done?" 
                       class="flex-1 px-4 py-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200">
                <button id="addButton" 
                        class="px-5 py-3 bg-gradient-to-br from-blue-600 to-indigo-600 text-white font-medium rounded-lg hover:opacity-90 transition-all duration-200 flex items-center gap-2">
                    Add Task
                </button>
            </div>
        </div>
        
        <div class="filters px-6 py-4 border-b bg-gray-50">
            <div class="flex justify-center gap-2">
                <button class="filter-btn px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium active" data-filter="all">All</button>
                <button class="filter-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition-colors" data-filter="active">Active</button>
                <button class="filter-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition-colors" data-filter="completed">Completed</button>
            </div>
        </div>
        
        <ul class="todo-list" id="todoList">
            <!-- Tasks will be dynamically inserted here -->
        </ul>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="text-center py-10">
                <p class="text-gray-500 italic text-sm">No tasks found. Add a task to get started!</p>
            </div>
        </div>
        
        <div class="stats px-6 py-4 border-t bg-gray-50">
            <div class="flex justify-between items-center text-sm">
                <span id="taskCount" class="text-gray-600">0 tasks</span>
                <button id="clearCompleted" 
                        class="px-4 py-2 bg-red-100 text-red-800 font-medium rounded-lg hover:bg-red-200 transition-colors">
                    Clear Completed
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskInput = document.getElementById('taskInput');
            const addButton = document.getElementById('addButton');
            const todoList = document.getElementById('todoList');
            const emptyState = document.getElementById('emptyState');
            const taskCount = document.getElementById('taskCount');
            const clearCompleted = document.getElementById('clearCompleted');
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let currentFilter = 'all';
            
            // Update task count display
            function updateTaskCount() {
                const activeCount = tasks.filter(task => !task.completed).length;
                const completedCount = tasks.filter(task => task.completed).length;
                
                if (currentFilter === 'all') {
                    taskCount.textContent = `${tasks.length} task${tasks.length !== 1 ? 's' : ''}`;
                } else if (currentFilter === 'active') {
                    taskCount.textContent = `${activeCount} active task${activeCount !== 1 ? 's' : ''}`;
                } else {
                    taskCount.textContent = `${completedCount} completed task${completedCount !== 1 ? 's' : ''}`;
                }
            }
            
            // Save tasks to localStorage
            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }
            
            // Render tasks based on current filter
            function renderTasks() {
                let filteredTasks = [];
                
                if (currentFilter === 'all') {
                    filteredTasks = tasks;
                } else if (currentFilter === 'active') {
                    filteredTasks = tasks.filter(task => !task.completed);
                } else {
                    filteredTasks = tasks.filter(task => task.completed);
                }
                
                todoList.innerHTML = '';
                
                if (filteredTasks.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';
                    
                    filteredTasks.forEach(task => {
                        const li = document.createElement('li');
                        li.className = `todo-item ${task.completed ? 'completed' : ''} py-4 px-6 border-b border-gray-200 last:border-b-0 hover:bg-gray-50 transition-colors duration-200`;
                        li.dataset.id = task.id;
                        
                        li.innerHTML = `
                            <div class="flex items-center gap-3">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} 
                                       class="w-4 h-4 text-blue-600 rounded border-gray-300">
                                <span class="todo-text flex-1 text-sm ${task.completed ? 'line-through text-gray-500' : 'text-gray-900'}">${task.text}</span>
                                <button class="delete-btn ml-2 p-1.5 bg-red-100 text-red-600 rounded hover:bg-red-200 transition-colors duration-200"
                                        title="Delete task">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                        `;
                        
                        todoList.appendChild(li);
                    });
                }
                
                updateTaskCount();
            }
            
            // Add a new task
            function addTask() {
                const text = taskInput.value.trim();
                if (text) {
                    const task = {
                        id: Date.now(),
                        text: text,
                        completed: false
                    };
                    tasks.push(task);
                    saveTasks();
                    renderTasks();
                    taskInput.value = '';
                    taskInput.focus();
                }
            }
            
            // Toggle task completion
            function toggleTask(e) {
                if (e.target.type === 'checkbox') {
                    const li = e.target.closest('.todo-item');
                    const id = parseInt(li.dataset.id);
                    const task = tasks.find(t => t.id === id);
                    
                    if (task) {
                        task.completed = !task.completed;
                        saveTasks();
                        renderTasks();
                    }
                }
            }
            
            // Delete a task
            function deleteTask(e) {
                if (e.target.classList.contains('delete-btn')) {
                    const li = e.target.closest('.todo-item');
                    const id = parseInt(li.dataset.id);
                    tasks = tasks.filter(task => task.id !== id);
                    saveTasks();
                    renderTasks();
                }
            }
            
            // Clear all completed tasks
            function clearCompletedTasks() {
                tasks = tasks.filter(task => !task.completed);
                saveTasks();
                renderTasks();
            }
            
            // Filter tasks
            function setFilter(filter) {
                currentFilter = filter;
                filterButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                    btn.classList.toggle('bg-gray-200', btn.dataset.filter !== filter);
                    btn.classList.toggle('text-gray-700', btn.dataset.filter !== filter);
                    btn.classList.toggle('bg-blue-600', btn.dataset.filter === filter);
                    btn.classList.toggle('text-white', btn.dataset.filter === filter);
                });
                renderTasks();
            }
            
            // Event Listeners
            addButton.addEventListener('click', addTask);
            
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            
            todoList.addEventListener('click', function(e) {
                if (e.target.type === 'checkbox') {
                    toggleTask(e);
                } else if (e.target.classList.contains('delete-btn')) {
                    deleteTask(e);
                }
            });
            
            clearCompleted.addEventListener('click', clearCompletedTasks);
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    setFilter(this.dataset.filter);
                });
            });
            
            // Initial render
            renderTasks();
        });
    </script>
</body>
</html>
